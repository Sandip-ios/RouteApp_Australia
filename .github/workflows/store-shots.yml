name: App Store screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/store/store_shots.py
      - uses: actions/upload-artifact@v4
        with: { name: store-shots, path: shots/ }
