<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dropline – no internet</title>
<style>
:root{--bg:#f3f5f4;--ink:#15211f;--muted:#5b6a67;--accent:#0f5c5a;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1514;--ink:#e7eeec;--muted:#9aaba7;--accent:#4fb3ad;--accent-ink:#06201f}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#123b3a;color:#fff;padding:max(14px,env(safe-area-inset-top)) 18px 14px;font:700 22px/1 "Arial Narrow",system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase}
main{padding:28px 20px;max-width:480px;margin:0 auto}
h1{font-size:22px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 14px}
button{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 18px system-ui,sans-serif;margin-top:8px}
#st{font-size:14px;text-align:center;margin-top:12px}
</style>
</head>
<body>
<header>Dropline</header>
<main>
  <h1>No internet connection</h1>
  <p>Dropline needs the internet to open. Your routes and deliveries are saved on this phone and will be there when you are back online.</p>
  <p>Turn off flight mode, or move to where you have mobile signal or Wi-Fi.</p>
  <button id="again">Try again</button>
  <p id="st"></p>
</main>
<script>
var APP = "https://sandip-ios.github.io/RouteApp_Australia/";
function go(){ document.getElementById("st").textContent = "Connecting…"; location.replace(APP); }
document.getElementById("again").addEventListener("click", go);
// reconnect by itself as soon as the phone is back online
window.addEventListener("online", go);
var tries = 0, t = setInterval(function(){ if (navigator.onLine && ++tries <= 6) go(); if (tries > 6) clearInterval(t); }, 10000);
</script>
</body>
</html>
