name: Probe services
on:
  push:
    branches: [main]
    paths: ["tools/probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe/snap_probe.py > probe.txt 2>&1 || true; cat probe.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete probe --yes --cleanup-tag || true
          gh release create probe probe.txt --prerelease --title "Service probe #${{ github.run_number }}" --notes "Service checks"
