name: Build Google Play bundle
# Builds the app bundle (.aab) for Google Play, package app.DropLine. It is built WITHOUT a key;
# the private upload key never goes into this public repository — the bundle is signed afterwards, off GitHub.
on:
  workflow_dispatch:
    inputs:
      versionCode: { description: "Version code (whole number, +1 for every upload)", required: true, default: "1" }
      versionName: { description: "Version name shown to users", required: true, default: "1.0" }
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - name: Prepare web app
        working-directory: android-app
        run: |
          npm ci
          mkdir -p www && cp ../index.html www/index.html && cp offline.html www/offline.html
          npx cap sync android
      - name: Build bundle (unsigned)
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease -PplayId=app.DropLine -PplayCode=${{ inputs.versionCode }} -PplayName=${{ inputs.versionName }} --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab ../../DropLine-unsigned.aab
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete play-unsigned --yes --cleanup-tag || true
          gh release create play-unsigned DropLine-unsigned.aab --prerelease --title "Play bundle ${{ inputs.versionName }} (${{ inputs.versionCode }}), unsigned" --notes "Unsigned. Must be signed with the private upload key before uploading to Google Play."
