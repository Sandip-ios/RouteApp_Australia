name: App Store screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/store/store_shots.py
      - name: Publish screenshots
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cd shots && zip -qr ../store-shots.zip . && cd ..
          gh release delete store-shots --yes --cleanup-tag || true
          gh release create store-shots store-shots.zip --prerelease --title "App Store screenshots" --notes "iPhone 6.9-inch screenshots (1320 x 2868)"
