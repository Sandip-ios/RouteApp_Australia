name: Build Android app

on:
  push:
    branches: [main]
    paths: ["index.html", "android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Prepare web app
        working-directory: android-app
        run: |
          npm ci
          mkdir -p www && cp ../index.html www/index.html
          npx cap sync android
      - name: Build test APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../../dropline.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dropline-apk
          path: dropline.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest dropline.apk \
            --title "Dropline Android test build #${{ github.run_number }}" \
            --notes "Test build from commit ${{ github.sha }}. Install on Android: download dropline.apk and open it." \
            --latest

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dropline-apk
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare test pages and tools
        run: |
          sudo apt-get install -y -q fonts-liberation
          pip install -q pillow numpy websocket-client==1.8.0
          python3 android-app/emulator-test/make_pages.py test-pages
      - name: Run the app in an Android emulator and scan the pages
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 android-app/emulator-test/drive.py dropline.apk test-pages emulator-results
      - name: Publish results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp test-pages/answers.csv emulator-results/ || true
          cd emulator-results && zip -q -r ../emulator-results.zip . && cd ..
          gh release delete emulator-results --yes --cleanup-tag || true
          gh release create emulator-results emulator-results.zip --prerelease \
            --title "Emulator test #${{ github.run_number }}" --notes "Synthetic run-sheet pages only (no customer data)."
