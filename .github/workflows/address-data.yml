name: Build address data (G-NAF)

on:
  push:
    branches: [main]
    paths: ["tools/gnaf/**", ".github/workflows/address-data.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download G-NAF (Feb 2026, official national address file)
        run: |
          curl -sSL --retry 3 -o gnaf.zip "https://data.gov.au/data/dataset/19432f89-dc3a-4ef3-b943-5326ef1dbecc/resource/5be5278c-fe66-459e-845a-bea553f46b4b/download/g-naf_feb26_allstates_gda2020_psv_1022.zip"
          ls -la gnaf.zip
          unzip -q gnaf.zip '*Standard/SA_ADDRESS_DETAIL_psv.psv' '*Standard/SA_ADDRESS_DEFAULT_GEOCODE_psv.psv' '*Standard/SA_STREET_LOCALITY_psv.psv' '*Standard/SA_LOCALITY_psv.psv' -d gnaf
          find gnaf -name '*.psv' -exec ls -la {} \;
      - name: Build per-postcode lookup files
        run: |
          pip install -q duckdb==1.1.3
          python3 tools/gnaf/build_geo.py gnaf geo SA
      - name: Save to the geo-data branch
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan geo-data
          git rm -rq --cached . && git clean -fdq -e geo
          git add geo && git commit -qm "Address data from G-NAF Feb 2026 (CC BY 4.0)" && git push -f origin geo-data
