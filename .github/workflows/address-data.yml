name: Build address data (G-NAF)

on:
  push:
    branches: [main]
    paths: ["tools/gnaf/**", ".github/workflows/address-data.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Find and download the latest G-NAF release
        run: |
          set -x
          python3 tools/gnaf/find_url.py > url.txt 2> diag.txt || true
          cat url.txt diag.txt
          URL=$(head -1 url.txt)
          echo "URL: $URL" >> diag.txt
          curl -sSL --retry 3 -A "Mozilla/5.0 (Dropline route planner build)" -o gnaf.zip -w "http %{http_code} size %{size_download}\n" "$URL" >> diag.txt 2>&1 || true
          ls -la gnaf.zip >> diag.txt 2>&1 || true
          unzip -l gnaf.zip 2>&1 | grep -E "SA_(ADDRESS_DETAIL|ADDRESS_DEFAULT_GEOCODE|STREET_LOCALITY|LOCALITY)_psv" >> diag.txt || echo "zip listing failed" >> diag.txt
          unzip -q gnaf.zip '*/SA_ADDRESS_DETAIL_psv.psv' '*/SA_ADDRESS_DEFAULT_GEOCODE_psv.psv' '*/SA_STREET_LOCALITY_psv.psv' '*/SA_LOCALITY_psv.psv' -d gnaf >> diag.txt 2>&1 || echo "unzip failed" >> diag.txt
          find gnaf -name '*.psv' -exec ls -la {} \; >> diag.txt 2>&1 || true
      - name: Build per-postcode lookup files
        run: |
          pip install -q duckdb==1.1.3
          python3 tools/gnaf/build_geo.py gnaf geo SA 2>&1 | tee -a diag.txt
      - name: Save to the geo-data branch
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          cp diag.txt /tmp/diag.txt
          git checkout --orphan geo-data
          git rm -rq --cached . && git clean -fdq -e geo
          git add geo && git commit -qm "Address data from G-NAF (CC BY 4.0)" && git push -f origin geo-data
      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=diag.txt; [ -f /tmp/diag.txt ] && f=/tmp/diag.txt
          gh release delete geo-diag --yes --cleanup-tag || true
          gh release create geo-diag "$f" --prerelease --title "Address data build #${{ github.run_number }}" --notes "Build log summary"
