name: Build address data (UK)

# Builds compact address files for the whole UK from free open data and publishes them with the app (geo/gb):
#   OS Code-Point Open (Open Government Licence) for every Great Britain postcode,
#   OpenStreetMap (ODbL) for house numbers, streets and Northern Ireland postcodes.
# Run by hand on the "uk" branch only: the files are committed to that branch, so nothing changes on the live app (main)
# until the UK launch merges the branch.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: uk-address-data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
          pip install -q osmium pyproj scipy numpy
      - name: Download postcodes (OS Code-Point Open)
        timeout-minutes: 15
        run: |
          curl -sSL --retry 3 --connect-timeout 30 --max-time 600 -A "Mozilla/5.0 (DropLine route planner address build)" -o codepoint.zip \
            -w "codepoint http %{http_code} size %{size_download}\n" "https://api.os.uk/downloads/v1/products/CodePointOpen/downloads?area=GB&format=CSV&redirect" | tee diag.txt
          unzip -l codepoint.zip | tail -3 | tee -a diag.txt
      - name: Download OpenStreetMap (UK and Northern Ireland)
        timeout-minutes: 60
        run: |
          for f in "gb europe/united-kingdom-latest.osm.pbf" "ie europe/ireland-and-northern-ireland-latest.osm.pbf"; do set -- $f
            curl -sSL --retry 3 --connect-timeout 30 --max-time 2400 -A "Mozilla/5.0 (DropLine route planner address build)" -o $1.pbf \
              -w "$1 http %{http_code} size %{size_download} speed %{speed_download}\n" "https://download.geofabrik.de/$2" | tee -a diag.txt
          done
          df -h . | tee -a diag.txt
      - name: Keep only addresses and named streets
        run: |
          set -x
          osmium extract -b -8.25,53.95,-5.35,55.40 ie.pbf -o ni.pbf --overwrite && rm ie.pbf
          for f in gb ni; do
            osmium tags-filter $f.pbf nw/addr:housenumber w/highway -o $f-addr.pbf --overwrite
            ls -la $f-addr.pbf | tee -a diag.txt
          done
          rm gb.pbf ni.pbf
      - name: Build files
        run: |
          rm -rf geo/gb
          python3 tools/ukgeo/build_gb.py codepoint.zip gb-addr.pbf ni-addr.pbf geo 2>&1 | tee -a diag.txt
          du -sh geo/gb | tee -a diag.txt; ls geo/gb | wc -l | tee -a diag.txt
          rm -f codepoint.zip *.pbf
      - name: Publish with the app (main branch)
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          cp diag.txt /tmp/diag.txt
          git add -A geo/gb
          B="${{ github.ref_name }}"; [ "$B" = "main" ] && { echo "Refusing to publish UK data to main before launch"; exit 1; }
          git commit -qm "UK address data (OS Code-Point Open, OGL; OpenStreetMap, ODbL)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "$B" && git push -q origin "HEAD:$B" && break; sleep 10; done
      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=diag.txt; [ -f /tmp/diag.txt ] && f=/tmp/diag.txt
          gh release delete uk-geo-diag --yes --cleanup-tag || true
          gh release create uk-geo-diag "$f" --prerelease --title "UK address data build #${{ github.run_number }}" --notes "Build log summary"
