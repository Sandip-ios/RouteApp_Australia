name: Build address data (UK)

# Builds compact address files for the whole UK from free open data and publishes them with the app (geo/gb):
#   OS Code-Point Open (Open Government Licence) for every Great Britain postcode,
#   OpenStreetMap (ODbL) for house numbers, streets and Northern Ireland postcodes.
on:
  push:
    branches: [main]
    paths: ["tools/ukgeo/**", ".github/workflows/uk-address-data.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: uk-address-data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download open data
        run: |
          set -x
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool > /dev/null
          pip install -q osmium pyproj scipy numpy
          UA="Mozilla/5.0 (DropLine route planner address build)"
          curl -sSL --retry 3 -A "$UA" -o codepoint.zip -w "codepoint http %{http_code} size %{size_download}\n" \
            "https://api.os.uk/downloads/v1/products/CodePointOpen/downloads?area=GB&format=CSV&redirect" | tee diag.txt
          unzip -l codepoint.zip | tail -3 | tee -a diag.txt
          curl -sSL --retry 3 -A "$UA" -o gb.pbf -w "gb http %{http_code} size %{size_download}\n" https://download.geofabrik.de/europe/united-kingdom-latest.osm.pbf | tee -a diag.txt
          curl -sSL --retry 3 -A "$UA" -o ie.pbf -w "ie http %{http_code} size %{size_download}\n" https://download.geofabrik.de/europe/ireland-and-northern-ireland-latest.osm.pbf | tee -a diag.txt
          df -h . | tee -a diag.txt
      - name: Keep only addresses and named streets
        run: |
          set -x
          osmium extract -b -8.25,53.95,-5.35,55.40 ie.pbf -o ni.pbf --overwrite && rm ie.pbf
          for f in gb ni; do
            osmium tags-filter $f.pbf nw/addr:housenumber w/highway -o $f-addr.pbf --overwrite
            ls -la $f-addr.pbf | tee -a diag.txt
          done
          rm gb.pbf ni.pbf
      - name: Build files
        run: |
          rm -rf geo/gb
          python3 tools/ukgeo/build_gb.py codepoint.zip gb-addr.pbf ni-addr.pbf geo 2>&1 | tee -a diag.txt
          du -sh geo/gb | tee -a diag.txt; ls geo/gb | wc -l | tee -a diag.txt
          rm -f codepoint.zip *.pbf
      - name: Publish with the app (main branch)
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          cp diag.txt /tmp/diag.txt
          git add -A geo/gb
          git commit -qm "UK address data (OS Code-Point Open, OGL; OpenStreetMap, ODbL)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
      - name: Publish diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=diag.txt; [ -f /tmp/diag.txt ] && f=/tmp/diag.txt
          gh release delete uk-geo-diag --yes --cleanup-tag || true
          gh release create uk-geo-diag "$f" --prerelease --title "UK address data build #${{ github.run_number }}" --notes "Build log summary"
